[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "panspatial"
version = "0.1.0"
description = "LLM-orchestrated pan-cancer spatial + single-cell NK atlas pipeline"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
azure = ["openai>=1.40"]
ingest = ["biopython>=1.81"]
spatial = [
    "scanpy>=1.10", "squidpy>=1.5", "anndata>=0.10", "scikit-learn>=1.3",
    "harmonypy>=0.0.9", "scib-metrics>=0.5", "leidenalg>=0.10",
]
deep = ["scvi-tools>=1.1", "torch>=2.2"]
translate = ["lifelines>=0.28"]
all = [
    "panspatial[llm,azure,ingest,spatial,deep,translate,dev]",
]
dev = ["pytest>=8.0"]

[project.scripts]
panspatial-prompt = "panspatial.orchestrator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
